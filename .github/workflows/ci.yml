name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + testy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Prisma CLI resolves env() in the schema even when it never opens a connection.
      DATABASE_URL: postgresql://weekplan:weekplan@localhost:5432/weekplan
      # Config is validated at import time, so the unit tests need something to import — the
      # tests themselves never reach the network.
      JIRA_URL: https://jira.example.com
      JIRA_USERNAME: ci
      JIRA_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

  format:
    name: Formátování (prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes prettier@3 --check .

  secrets:
    name: Kontrola citlivých údajů
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Žádný .env ani interní hostname v repu
        run: |
          set -e
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env nesmí být ve verzovacím systému"
            exit 1
          fi
          # Only an env-file style assignment with a literal value is a leak;
          # `${VAR}` interpolation and zod schema keys are legitimate.
          if git grep -nIE '^[^#]*(JIRA_PASSWORD|JIRA_USERNAME)=[^$[:space:]"'"'"']' -- . ':!*.example'; then
            echo "::error::vypadá to na natvrdo zapsané přihlašovací údaje"
            exit 1
          fi
          if git grep -nIE 'https?://[a-z0-9.-]*jira[a-z0-9.-]*\.(cz|com|net)' -- . ':!*.example' ':!README.md'; then
            echo "::error::konkrétní JIRA instance patří jen do .env"
            exit 1
          fi

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t weekplan-api ./backend
      - run: docker build -t weekplan-web ./frontend
